<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260">
<rect width="1440" height="1260" fill="#fafafa"/><g font-family="Arial,sans-serif"><text x="72" y="82" font-size="14" fill="#a3292e">Lucas Asth · Portfólio profissional</text><text x="72" y="143" font-size="44" font-weight="700" fill="#252529">Identidade, componentes e ritmo.</text><text x="72" y="184" font-size="18" fill="#676773">Referência dos estilos usados no site. Os wireframes usam cinza para priorizar a hierarquia.</text>
<text x="72" y="256" font-size="24" font-weight="700" fill="#252529">Cores</text>
<g><rect x="72" y="285" width="196" height="100" rx="8" fill="#222223"/><rect x="292" y="285" width="196" height="100" rx="8" fill="#2b2526"/><rect x="512" y="285" width="196" height="100" rx="8" fill="#b62a2d"/><rect x="732" y="285" width="196" height="100" rx="8" fill="#d5575e"/><rect x="952" y="285" width="196" height="100" rx="8" fill="#e6a8a8"/><rect x="1172" y="285" width="196" height="100" rx="8" fill="#fff" stroke="#ccc"/></g>
<g font-size="15" fill="#252529"><text x="72" y="412">Fundo · #222223</text><text x="292" y="412">Painel · #2b2526</text><text x="512" y="412">Ação · #b62a2d</text><text x="732" y="412">Destaque · #d5575e</text><text x="952" y="412">Texto suave · #e6a8a8</text><text x="1172" y="412">Texto · #ffffff</text></g>
<path d="M72 457H1368" stroke="#d3d3d9"/><text x="72" y="513" font-size="24" font-weight="700" fill="#252529">Tipografia</text><text x="72" y="574" font-size="42" font-weight="700" fill="#252529">Ideias viram software.</text><text x="72" y="609" font-size="15" fill="#676773">Inter / Segoe UI · títulos da página inicial e texto corrido</text><text x="780" y="574" font-family="Georgia,serif" font-size="42" fill="#252529">Código em prática.</text><text x="780" y="609" font-size="15" fill="#676773">DM Serif Display / Georgia · títulos editoriais</text><text x="72" y="655" font-family="Consolas,monospace" font-size="16" fill="#676773">IBM Plex Mono / Consolas · menu, datas e tecnologias</text>
<path d="M72 702H1368" stroke="#d3d3d9"/><text x="72" y="754" font-size="24" font-weight="700" fill="#252529">Componentes</text><rect x="72" y="784" width="1296" height="250" rx="10" fill="#222223"/>
<rect x="104" y="818" width="230" height="48" rx="3" fill="#b62a2d"/><text x="219" y="848" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Enviar mensagem</text><rect x="354" y="818" width="230" height="48" rx="3" fill="none" stroke="#ffffff50"/><text x="469" y="848" font-size="16" fill="#fff" text-anchor="middle">Ver minha experiência</text><rect x="604" y="818" width="120" height="48" rx="3" fill="#2b2526" stroke="#ffffff50"/><text x="664" y="847" font-size="15" fill="#e6a8a8" text-anchor="middle">JavaScript</text>
<text x="104" y="910" font-size="15" fill="#e6a8a8">Nome completo</text><rect x="104" y="926" width="480" height="52" rx="3" fill="#2b2526" stroke="#ffffff50"/><text x="121" y="958" font-size="16" fill="#fff">Visitante do portfólio</text><rect x="604" y="903" width="330" height="75" rx="6" fill="#2b2526" stroke="#ffffff40"/><text x="628" y="934" font-size="18" font-weight="700" fill="#fff">PUC Minas</text><text x="628" y="959" font-size="15" fill="#e6a8a8">Fev 2026 — atual</text><text x="985" y="936" font-size="18" font-weight="700" fill="#fff">Mensagem enviada!</text><text x="985" y="963" font-size="14" fill="#e6a8a8">Confirmação e retorno ao formulário</text>
<text x="72" y="1093" font-size="24" font-weight="700" fill="#252529">Layout e acessibilidade</text><text x="72" y="1134" font-size="16" fill="#676773">Conteúdo máximo: 1120 px · Espaçamentos: 8 / 16 / 24 / 32 / 48 / 64 px · Mobile: 390 px</text><text x="72" y="1167" font-size="16" fill="#676773">Foco visível, labels nos campos, navegação por teclado e preferência por movimento reduzido.</text><text x="72" y="1202" font-size="14" fill="#676773">Interações do site: pintura do retrato, busca de livros, abas de habilidades e formulário com estados de envio.</text></g></svg>
