Segoe UI&quot;, sans-serif" font-size="16" font-weight="400" letter-spacing="0" textLength="514.17" lengthAdjust="spacingAndGlyphs">Desenvolvo relatórios e atendo clientes. Também apoio a organização de</text><text x="539" y="479.1" fill="rgb(230, 168, 168)" font-family="Inter, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="400" letter-spacing="0" textLength="430.64" lengthAdjust="spacingAndGlyphs">procedimentos internos e automatizo tarefas administrativas.</text><text x="539" y="544.34" fill="rgb(255, 255, 255)" font-family="Inter, &quot;Segoe UI&quot;, sans-serif" font-size="22.08" font-weight="700" letter-spacing="-0.552" textLength="298.19" lengthAdjust="spacingAndGlyphs">Desenvolvedor web freelancer</text><text x="539" y="577.49" fill="rgb(255, 255, 255)" font-family="Inter, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="400" letter-spacing="0" textLength="300.03" lengthAdjust="spacingAndGlyphs">Projetos para clientes e iniciativas pessoais</text><text x="539" y="607.55" fill="rgb(230, 168, 168)" font-family="&quot;IBM Plex Mono&quot;, Consolas, &quot;Courier New&quot;, monospace" font-size="12.48" font-weight="400" letter-spacing="0.6864" textLength="120.78" lengthAdjust="spacingAndGlyphs">Out 2025 — atual</text><text x="539" y="642.48" fill="rgb(230, 168, 168)" font-family="Inter, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="400" letter-spacing="0" textLength="580.91" lengthAdjust="spacingAndGlyphs">Desenvolvo sites, APIs REST e automações para comércios locais, do levantamento</text><text x="539" y="668.87" fill="rgb(230, 168, 168)" font-family="Inter, &quot;Segoe UI&quot;, sans-serif" font-size="16" font-weight="400" letter-spacing="0" textLength="331.19" lengthAdjust="spacingAndGlyphs">das necessidades à implementação da solução.</text><rect x="160" y="739.3" width="1120" height="88" rx="0" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/><text x="160" y="782.71" fill="rgb(230, 168, 168)" font